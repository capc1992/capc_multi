# Preparado para /etc/nginx/sites-available/updates.capcmultiservicios.site.
# No aplicar hasta crear DNS, certificado TLS y el directorio de solo lectura.
server {
    listen 80;
    listen [::]:80;
    server_name updates.capcmultiservicios.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name updates.capcmultiservicios.site;

    ssl_certificate /etc/letsencrypt/live/updates.capcmultiservicios.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.capcmultiservicios.site/privkey.pem;
    root /var/www/capc-updates;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/windows/(stable|beta|testing)/latest\.json$ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        expires -1;
        limit_except GET HEAD { deny all; }
    }

    location ~ ^/windows/(stable|beta|testing)/[0-9]+\.[0-9]+\.[0-9]+/CAPC-MULTISERVICIO-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe$ {
        try_files $uri =404;
        default_type application/vnd.microsoft.portable-executable;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_except GET HEAD { deny all; }
    }

    location / { return 404; }
}

# Propiedad recomendada: root:root; directorios 0755; archivos 0644.
# El usuario de despliegue escribe mediante sudo limitado; www-data solo lee.
