openapi: 3.1.0
info:
  title: CAPC Sync API
  version: 1.0.0
  description: Intercambio offline-first de eventos; no contiene credenciales locales.
servers:
  - url: https://sync.example.invalid
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Servicio activo
  /api/v1/sync/push:
    post:
      operationId: pushOperations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Operation' }
      responses:
        '200': { description: Operaciones aceptadas o ya procesadas }
        '400': { description: Contenido inválido o secreto }
        '401': { description: Token ausente o inválido }
        '403': { description: Negocio fuera del alcance solicitado }
        '409': { description: operation_id reutilizado con otro contenido }
  /api/v1/sync/pull:
    get:
      operationId: pullOperations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
        - { name: business_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: device_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { description: Cambios posteriores al cursor, ordenados ascendentemente }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    BusinessHeader:
      name: X-Business-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Operation:
      type: object
      additionalProperties: false
      required: [business_id, device_id, operation_id, type, schema_version, occurred_at, content]
      properties:
        business_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        type: { type: string, maxLength: 80 }
        schema_version: { type: integer, const: 1 }
        occurred_at: { type: string, format: date-time }
        content: { type: object }
